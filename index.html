<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Set to the active theme's background by the script below and by useTheme. -->
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Applies the saved theme and language before first paint (no light flash, correct lang).
      // Storage keys and fallbacks must stay in sync with useTheme.ts and LanguageProvider.tsx;
      // theme-color values must match --background in index.css and THEME_COLORS in constants/themes.ts.
      ;(function () {
        function read(key) {
          try {
            return localStorage.getItem(key)
          } catch {
            return null
          }
        }
        var theme = read('theme')
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        }
        document.documentElement.classList.toggle('dark', theme === 'dark')
        var themeColor = document.querySelector('meta[name="theme-color"]')
        if (themeColor) {
          themeColor.setAttribute(
            'content',
            theme === 'dark' ? '#0a0a0a' : '#ffffff'
          )
        }
        document.documentElement.lang = read('language') === 'lt' ? 'lt' : 'en'
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Adomas Pakalniškis — Software Developer</title>
    <meta
      name="description"
      content="Portfolio of Adomas Pakalniškis, a software developer and Software Systems student."
    />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Adomas Pakalniškis — Software Developer"
    />
    <meta
      property="og:description"
      content="Portfolio of Adomas Pakalniškis, a software developer and Software Systems student."
    />
    <meta property="og:url" content="https://www.adomaspak.com/" />
    <meta property="og:site_name" content="Adomas Pakalniškis" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="lt_LT" />
    <meta
      property="og:image"
      content="https://www.adomaspak.com/og-image.png"
    />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta
      property="og:image:alt"
      content='Dark-mode homepage of Adomas Pakalniškis&#39;s portfolio: "Software Systems Student, Software Developer".'
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Adomas Pakalniškis — Software Developer"
    />
    <meta
      name="twitter:description"
      content="Portfolio of Adomas Pakalniškis, a software developer and Software Systems student."
    />
    <meta
      name="twitter:image"
      content="https://www.adomaspak.com/og-image.png"
    />
    <meta
      name="twitter:image:alt"
      content='Dark-mode homepage of Adomas Pakalniškis&#39;s portfolio: "Software Systems Student, Software Developer".'
    />

    <!-- SEO -->
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.adomaspak.com/" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
