<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Applies the saved theme and language before first paint (no light flash, correct lang).
      // Storage keys and fallbacks must stay in sync with useTheme.ts and LanguageProvider.tsx.
      ;(function () {
        function read(key) {
          try {
            return localStorage.getItem(key)
          } catch {
            return null
          }
        }
        var theme = read('theme')
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        }
        document.documentElement.classList.toggle('dark', theme === 'dark')
        document.documentElement.lang = read('language') === 'lt' ? 'lt' : 'en'
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Adomas Pakalniškis — Software Developer</title>
    <meta
      name="description"
      content="Portfolio of Adomas Pakalniškis, a software developer and Software Systems student."
    />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Adomas Pakalniškis — Software Developer"
    />
    <meta
      property="og:description"
      content="Portfolio of Adomas Pakalniškis, a software developer and Software Systems student."
    />
    <meta property="og:url" content="https://adomaspak.com" />
    <meta property="og:image" content="https://adomaspak.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Adomas Pakalniškis — Software Developer"
    />
    <meta
      name="twitter:description"
      content="Portfolio of Adomas Pakalniškis, a software developer and Software Systems student."
    />
    <meta name="twitter:image" content="https://adomaspak.com/og-image.png" />

    <!-- Theme Color -->
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0a0a0a"
      media="(prefers-color-scheme: dark)"
    />

    <!-- SEO -->
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://adomaspak.com" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
